name: Maquoketa Research
description: >-
  Maquoketa Research is a defense-technology startup (Y Combinator, Spring 2026)
  building autonomous terminal-guidance systems for one-way attack drones. Its
  platform-agnostic guidance modules add custom computer-vision object tracking
  to low-cost FPV drone hardware, raising strike success rates from under 25% to
  roughly 80% while maintaining target lock through GPS jamming and signal loss.
  Founded in 2025 and based in San Francisco, the five-person team ships hardware
  modules (product lines include GCS, Magpie, Odin, and TGS) that integrate with
  existing drone flight controllers rather than a public developer API. This
  profile was surfaced as a Y Combinator portfolio company and enriched from the
  company's public website; it currently exposes no public API, SDK, or developer
  platform surface.
